<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Shola</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/shola-logo.png" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&family=Lora:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div id="header"></div>

    <!--==================================
        SHOLA ART GALLERY
===================================-->

    <section class="shola-gallery">

        <div class="container">

            <!-- Heading -->

            <div class="text-center mb-5">

                <span class="shola-gallery-tag">
                    ART GALLERY
                </span>

                <h2 class="shola-gallery-title">
                    Every Painting
                    <br>
                    Tells A Story
                </h2>

                <p class="shola-gallery-subtitle">

                    Explore handcrafted artwork created with passion,
                    celebrating memories, traditions and timeless craftsmanship.

                </p>

            </div>


            <!-- Gallery -->

            <div class="shola-gallery-grid">


                <!-- Image -->

                <div class="shola-gallery-item">

                    <img src="https://picsum.photos/700/900?random=11" alt="Gallery">

                    <div class="shola-gallery-overlay">

                        <span>Portrait Collection</span>

                    </div>

                </div>



                <div class="shola-gallery-item">

                    <img src="https://picsum.photos/700/500?random=12" alt="Gallery">

                    <div class="shola-gallery-overlay">

                        <span>Nature Inspired</span>

                    </div>

                </div>



                <div class="shola-gallery-item">

                    <img src="https://picsum.photos/700/750?random=13" alt="Gallery">

                    <div class="shola-gallery-overlay">

                        <span>Traditional Art</span>

                    </div>

                </div>



                <div class="shola-gallery-item">

                    <img src="https://picsum.photos/700/1000?random=14" alt="Gallery">

                    <div class="shola-gallery-overlay">

                        <span>Custom Portrait</span>

                    </div>

                </div>



                <div class="shola-gallery-item">

                    <img src="https://picsum.photos/700/550?random=15" alt="Gallery">

                    <div class="shola-gallery-overlay">

                        <span>Abstract Canvas</span>

                    </div>

                </div>



                <div class="shola-gallery-item">

                    <img src="https://picsum.photos/700/850?random=16" alt="Gallery">

                    <div class="shola-gallery-overlay">

                        <span>Spiritual Collection</span>

                    </div>

                </div>

            </div>

        </div>

    </section>



    <!--==================================
        IMAGE LIGHTBOX
===================================-->

    <div class="shola-lightbox">

        <span class="shola-lightbox-close">

            &times;

        </span>

        <button class="shola-lightbox-prev">

            <i class="fa fa-chevron-left"></i>

        </button>

        <button class="shola-lightbox-next">

            <i class="fa fa-chevron-right"></i>

        </button>

        <img id="sholaLightboxImage" src="" alt="Gallery Image">

    </div>

    <div id="footer"></div>

    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square rounded-circle back-to-top"><i
            class="bi bi-arrow-up"></i></a>


    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="lib/owlcarousel/owl.carousel.min.js"></script>

    <!-- Template Javascript -->
    <script src="js/include.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Ensure carousel is initialized even if auto-ride is interfered with
        document.addEventListener('DOMContentLoaded', function () {
            try {
                var el = document.getElementById('header-carousel');
                if (el && window.bootstrap && bootstrap.Carousel) {
                    // re-init with options
                    var c = bootstrap.Carousel.getInstance(el);
                    if (!c) {
                        new bootstrap.Carousel(el, { interval: 4000, ride: 'carousel' });
                    } else {
                        c.cycle();
                    }
                }
            } catch (e) {
                console.warn('Carousel init error', e);
            }
        });
    </script>
</body>
